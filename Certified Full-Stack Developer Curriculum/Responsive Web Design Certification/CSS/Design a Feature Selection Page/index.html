<html lang="en">

<head>

    <title>Selection Feature Page</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Feature Selection</h1>
    <div class="feature-card-container">
        <label class="feature-card">
            <input type="checkbox">Cloud Storage
            <span>100 Gigabyte secure storage</span>
        </label>
        
        <label class="feature-card">
            <input type="checkbox">Dedicated Support
            <span>24/7 customer help</span>
        </label>
        
        <label class="feature-card">
            <input type="checkbox">Advanced Analytics
            <span>Insights & reports</span>
        </label>
        
        <label class="feature-card">
            <input type="checkbox">Custom User Themes
            <span>Personalized dashboard design</span>
        </label>
        
        <label class="feature-card">
            <input type="checkbox">Multi-User Collab
            <span>Team access and sharing</span>
        </label>
        
        <label class="feature-card">

            <span>Integrate with your custom built tools</span>
        </label>
        
    </div>
</body>

</html>
