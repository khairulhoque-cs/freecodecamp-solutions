<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <header>
    <h1 id="title">freeCodecamp Survey Form</h1>
    <p id="description">Thank you for taking the time to help us improve the platform</p>
    </header>

    <main>
      <form id="survey-form">
        
        <!--Name-->
        <label id="name-label" for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <!--Email-->
        <label id="email-label" for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your Email" required>

        <!--Age(Number)-->
        <label id="number-label" for="number">Age(optional)</label>
        <input type="number" name="age" id="number" placeholder="Age" min="3" max="100">

        <label>Which option best describe your current role?</label>
        <select id="dropdown">
          <option value="select-current-role">Select current role</option>
          <option value="student">Student</option>
          <option value="full-time-job">Full Time Job</option>
          <option value="full-time-learner">Full Time Learner</option>
          <option value="prefer-not-to-say">Prefer not to say</option>
          <option value="other">Other</option>
        </select>

        <label>Would you recommend freeCodeCamp to a friend?</label>
        <input checked name="recommend" type="radio" value="definitely">
        <label for="definitely-option">Definitely</label>
        <input name="recommend" type="radio" value="maybe">
        <label for="maybe-option">Maybe</label>
        <input name="recommend" type="radio" value="not-sure">
        <label for="not-sure-option">Not sure</label>

        <label>What is your favorite feature of freeCodeCamp?</label>
        <select id="favorite-feature">
          <option value="select-an-option">Select an option</option>
          <option value="challenges">Challenges</option>
          <option value="projects">Projects</option>
          <option value="community">Community</option>
          <option value="open-source">Open Source</option>
        </select>

        <label>What would you like to see improved? (Check all that apply)</label>
        <input type="checkbox" id="projects" name="choice" value="projects">
        <label for="projects">Front-end Projects</label>

        <input type="checkbox" id="projects" name="choice" value="projects">
        <label for="projects">Back-end Projects</label>

        <input type="checkbox" id="visualization" name="choice" value="visualization">
        <label for="visualization">Data Visualization</label>

        <input type="checkbox" id="challenges" name="choice" value="challenges">
        <label for="challenges">Challenges</label>

        <input type="checkbox" id="open-source-community" name="choice" value="open-source-community">
        <label for="open-source-community">Open Source Community</label>
        
        <!--Textarea-->
        <label for="comments">Any comments or suggestions?</label>
        <textarea cols="30" rows="10" name="comments" id="comments"></textarea>
        
        <!--Submit(Button)-->
        <button type="submit" id="submit">Submit</button>
      </form>
    </main>

  </body>
</html>
