<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Donation Form</title>
</head>
<body>
  <h1>Donation Form</h1>
  <form>
    
    <label for="full-name" id="name-label">Full Name:</label>
    <input type="text" id="full-name" name="name" required>

    <label for="email" id="email-label">Email Address:</label>
    <input type="email" id="email" name="email" required>

    <label for="number" id="amount-label">Donation Amount ($):</label>
    <input type="number" id="number" name="amount" required>

    <input type="checkbox" id="subscribe" name="newsletter">
    <label for="subscribe">Subscribe</label>

    <input type="submit" value="Send">
  </form>
</body>
</html>
